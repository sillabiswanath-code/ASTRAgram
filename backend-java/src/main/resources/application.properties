spring.application.name=backend-java
# M10: This default port is overridden at runtime by START_ASTRAGRAM.bat via -Dserver.port=<free_port>
server.port=8080

# Show full error details in API responses (helpful for debugging)
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# C6 fix: raised from 5 min to 30 min — long videos (Whisper + quiz gen) can take >5 min
spring.mvc.async.request-timeout=1800000
server.tomcat.connection-timeout=1800000
