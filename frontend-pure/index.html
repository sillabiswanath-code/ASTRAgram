<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTRAgram | Learning OS</title>
    
    <!-- React & ReactDOM (Development versions via CDN) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel standalone for compiling JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="root"></div>

    <!-- Main React App code written in pure JSX -->
    <script>
        fetch('app.js?v=7')
            .then(res => {
                if (!res.ok) throw new Error("HTTP error " + res.status);
                return res.text();
            })
            .then(code => {
                const compiled = Babel.transform(code, {
                    presets: [
                        ['react', { runtime: 'classic' }]
                    ]
                }).code;
                const script = document.createElement('script');
                script.text = compiled;
                document.body.appendChild(script);
            })
            .catch(err => {
                console.error("Failed to load or compile app.js:", err);
            });
    </script>
</body>
</html>
